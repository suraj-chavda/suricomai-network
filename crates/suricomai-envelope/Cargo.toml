[package]
name = "suricomai-envelope"
version = "0.1.0"
edition = "2021"
publish = false
license-file = "../../LICENSE"
description = "Sealed prompt contracts, receipts, and proof audit for SuriComAI"

[features]
# Software quote for development. Off in every build that ships.
lab = []

[dependencies]
blake3 = "1.5"
ed25519-dalek = { version = "2.1", features = ["rand_core", "zeroize"] }
hpke = "=0.15.1"
rand = "0.8"
zeroize = "1.8"

[dev-dependencies]
suricomai-envelope = { path = ".", features = ["lab"] }
serde_json = "1"
