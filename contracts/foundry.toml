[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
solc_version = "0.8.28"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
# No third-party Solidity dependencies on purpose. Cheatcodes and mocks live in test/.
libs = []

[fuzz]
runs = 512

[invariant]
runs = 256
depth = 64
fail_on_revert = false
