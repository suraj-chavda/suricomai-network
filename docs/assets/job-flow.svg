<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 250" role="img" aria-labelledby="t d">
  <title id="t">One SuriComAI inference job, private tier</title>
  <desc id="d">Six steps: fund, verify, seal, run, return, settle.</desc>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#6b7694"/></marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1320"/><stop offset="1" stop-color="#0a0c12"/></linearGradient>
  </defs>
  <style>
    text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#e8ecf8;text-anchor:middle}
    .h{font-size:20px;font-weight:700}.k{font-size:16px;font-weight:700}.n{font-size:12.5px;fill:#9aa6c6}.i{font-size:12px;font-weight:700;fill:#7f93ff}
    .b{fill:#141a2c;stroke:#2a3454;stroke-width:1.5}.g{fill:#10281f;stroke:#2f8f68;stroke-width:1.5}
  </style>
  <rect width="1080" height="250" rx="16" fill="url(#bg)"/>
  <text x="540" y="40" class="h">One inference job (private tier)</text>

  <rect x="24" y="72" width="152" height="124" rx="10" class="b"/>
  <text x="100" y="98" class="i">STEP 1</text><text x="100" y="124" class="k">Fund</text>
  <text x="100" y="150" class="n">Lock the fee in</text><text x="100" y="168" class="n">escrow</text>

  <rect x="200" y="72" width="152" height="124" rx="10" class="b"/>
  <text x="276" y="98" class="i">STEP 2</text><text x="276" y="124" class="k">Verify</text>
  <text x="276" y="150" class="n">Check worker proof</text><text x="276" y="168" class="n">before sending</text>

  <rect x="376" y="72" width="152" height="124" rx="10" class="b"/>
  <text x="452" y="98" class="i">STEP 3</text><text x="452" y="124" class="k">Seal</text>
  <text x="452" y="150" class="n">Encrypt the prompt</text><text x="452" y="168" class="n">to the worker key</text>

  <rect x="552" y="72" width="152" height="124" rx="10" class="b"/>
  <text x="628" y="98" class="i">STEP 4</text><text x="628" y="124" class="k">Run</text>
  <text x="628" y="150" class="n">Named model runs</text><text x="628" y="168" class="n">in a measured guest</text>

  <rect x="728" y="72" width="152" height="124" rx="10" class="b"/>
  <text x="804" y="98" class="i">STEP 5</text><text x="804" y="124" class="k">Return</text>
  <text x="804" y="150" class="n">Encrypted answer</text><text x="804" y="168" class="n">plus proof bundle</text>

  <rect x="904" y="72" width="152" height="124" rx="10" class="g"/>
  <text x="980" y="98" class="i" style="fill:#5fd6a0">STEP 6</text><text x="980" y="124" class="k">Settle</text>
  <text x="980" y="150" class="n">Valid proof: pay.</text><text x="980" y="168" class="n">Bad proof: refund.</text>

  <g stroke="#6b7694" stroke-width="2" marker-end="url(#a)">
    <path d="M178 134 L196 134"/><path d="M354 134 L372 134"/><path d="M530 134 L548 134"/><path d="M706 134 L724 134"/><path d="M882 134 L900 134"/>
  </g>
  <text x="540" y="228" class="n">Relays and the chain only ever see opaque ciphertext and proofs, never the conversation.</text>
</svg>
