<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="t d">
  <title id="t">SuriComAI architecture: settlement layer and execution market</title>
  <desc id="d">Two layers. The settlement layer holds fees, bonds and proof commitments. The execution market runs sealed jobs on executors and relays.</desc>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#6b7694"/></marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1320"/><stop offset="1" stop-color="#0a0c12"/></linearGradient>
  </defs>
  <style>
    text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#e8ecf8}
    .h{font-size:20px;font-weight:700}.s{font-size:13px;fill:#9aa6c6}.m{font-size:13px;font-weight:600}.n{font-size:12px;fill:#9aa6c6}
    .card{fill:#141a2c;stroke:#2a3454;stroke-width:1.5}
    .ok{fill:#10281f;stroke:#2f8f68}.no{fill:#2c1519;stroke:#b4475a}.nd{fill:#12233a;stroke:#3f7fd1}
  </style>
  <rect width="960" height="380" rx="16" fill="url(#bg)"/>
  <text x="480" y="38" text-anchor="middle" class="h">Two layers: settlement and execution</text>

  <rect x="32" y="62" width="400" height="286" rx="12" class="card"/>
  <text x="232" y="94" text-anchor="middle" class="h" style="font-size:17px">Settlement layer</text>
  <text x="232" y="116" text-anchor="middle" class="s">Holds fees and bonds, pays on valid proofs</text>
  <rect x="56" y="136" width="352" height="46" rx="8" class="card" style="fill:#1a2240"/>
  <text x="232" y="164" text-anchor="middle" class="m">Escrow · Attestations · Receipts · Refunds</text>
  <rect x="56" y="198" width="168" height="70" rx="8" class="ok"/>
  <text x="140" y="226" text-anchor="middle" class="m">Keeps on chain</text>
  <text x="140" y="246" text-anchor="middle" class="n">commitments and proofs</text>
  <rect x="240" y="198" width="168" height="70" rx="8" class="no"/>
  <text x="324" y="226" text-anchor="middle" class="m">Never stores</text>
  <text x="324" y="246" text-anchor="middle" class="n">prompt or answer text</text>
  <text x="232" y="308" text-anchor="middle" class="s">Runs on an existing chain first (planned)</text>

  <rect x="528" y="62" width="400" height="286" rx="12" class="card"/>
  <text x="728" y="94" text-anchor="middle" class="h" style="font-size:17px">Execution market</text>
  <text x="728" y="116" text-anchor="middle" class="s">Off-chain inference, sealed jobs and proofs</text>
  <rect x="552" y="136" width="352" height="46" rx="8" class="card" style="fill:#1a2240"/>
  <text x="728" y="164" text-anchor="middle" class="m">Sealed jobs · Executors · Relays</text>
  <rect x="552" y="198" width="104" height="70" rx="8" class="nd"/>
  <text x="604" y="226" text-anchor="middle" class="m">User</text><text x="604" y="246" text-anchor="middle" class="n">wallet</text>
  <rect x="676" y="198" width="104" height="70" rx="8" class="nd"/>
  <text x="728" y="226" text-anchor="middle" class="m">Executor</text><text x="728" y="246" text-anchor="middle" class="n">TEE or open</text>
  <rect x="800" y="198" width="104" height="70" rx="8" class="nd"/>
  <text x="852" y="226" text-anchor="middle" class="m">Relay</text><text x="852" y="246" text-anchor="middle" class="n">routes ciphertext</text>
  <text x="728" y="308" text-anchor="middle" class="s">Inference never sits on the consensus path</text>

  <path d="M436 215 L524 215" stroke="#6b7694" stroke-width="2" marker-end="url(#a)"/>
  <path d="M524 245 L436 245" stroke="#6b7694" stroke-width="2" marker-end="url(#a)"/>
  <text x="480" y="204" text-anchor="middle" class="n">proofs</text>
  <text x="480" y="266" text-anchor="middle" class="n">payment</text>
</svg>
