[package]
name = "suricomai-desktop"
version = "0.1.0"
edition = "2021"
publish = false
license-file = "../../../LICENSE"
description = "SuriComAI Network desktop app (development build)"

# A workspace of its own: the web engine and its dependencies never enter the protocol crates.
[workspace]

[lib]
name = "suricomai_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = ["isolation"] }

[dependencies]
# Exact pins. The lock file is committed. Both versions are at least two weeks old.
tauri = { version = "=2.12.4", default-features = false, features = ["wry", "compression", "isolation"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
suricomai-runtime = { path = "../../../crates/suricomai-runtime", features = ["lab"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
