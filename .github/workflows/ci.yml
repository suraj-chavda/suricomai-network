name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  network:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python verifiers and dependencies
        shell: bash
        run: |
          python -m pip install -r verifiers/python/requirements.txt
          python verifiers/python/audit_proof.py vectors/audit-v1.json
      - name: Clippy
        run: cargo clippy --workspace --all-targets --features suricomai-runtime/lab --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --features suricomai-runtime/lab --locked
