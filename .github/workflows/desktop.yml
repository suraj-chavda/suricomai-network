name: desktop
on:
  push:
    paths: ['apps/desktop/**', 'crates/**']
  pull_request:
    paths: ['apps/desktop/**', 'crates/**']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Isolation tests
        run: node --test apps/desktop/isolation/isolation.test.js
      - name: Clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked
